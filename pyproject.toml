[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-dancer"
version = "0.1.0"
description = "Offline dance and audio controller for a Unitree G1 development PC"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
g1-dancer = "g1_dancer.cli:main"

[tool.setuptools]
packages = ["g1_dancer", "desktop_app"]

[tool.setuptools.package-dir]
g1_dancer = "src/g1_dancer"
desktop_app = "desktop_app"

[tool.setuptools.package-data]
desktop_app = ["assets/*.png", "web/*"]
