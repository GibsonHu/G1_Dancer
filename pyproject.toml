[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-dancer"
version = "0.1.0"
description = "Offline dance and audio controller for a Unitree G1 development PC"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
robot = [
    "unitree-sdk2py @ git+https://github.com/unitreerobotics/unitree_sdk2_python.git@65691c8a8bc53b98d3976dba4dbf9d5d20b2e7f5",
]

[project.scripts]
g1-dancer = "g1_dancer.cli:main"

[tool.setuptools]
packages = ["g1_dancer", "desktop_app"]

[tool.setuptools.package-dir]
g1_dancer = "src/g1_dancer"
desktop_app = "desktop_app"

[tool.setuptools.package-data]
desktop_app = ["assets/*.png", "web/*"]
